name: Update bun.lock

# Run this manually from the GitHub website whenever package.json changes
# and bun.lock needs to catch up (fixes Cloudflare's "lockfile is frozen"
# build error). No local terminal needed — see the "Actions" tab.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Commit updated lockfile (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already up to date — nothing to commit."
          else
            git add bun.lock
            git commit -m "chore: update bun.lock [skip ci]"
            git push
          fi
